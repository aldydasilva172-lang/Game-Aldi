<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>RM KEMANG GAMES</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- CACHE OFF -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  overflow:hidden;
  color:white;
  background:
  linear-gradient(rgba(5,5,15,0.72),rgba(5,5,15,0.92)),
  url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1600&auto=format&fit=crop');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}

/* glow */
body::before,
body::after{
  content:'';
  position:fixed;
  width:450px;
  height:450px;
  border-radius:50%;
  filter:blur(120px);
}

body::before{
  background:rgba(0,255,255,0.16);
  top:-120px;
  left:-120px;
}

body::after{
  background:rgba(255,0,255,0.14);
  bottom:-120px;
  right:-120px;
}

.topbar{
  width:100%;
  padding:20px;
  text-align:center;
  font-family:'Orbitron',sans-serif;
  font-size:30px;
  font-weight:900;
  letter-spacing:3px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(15px);
  border-bottom:1px solid rgba(255,255,255,0.08);
  text-shadow:0 0 20px cyan;
}

.container{
  width:100%;
  height:calc(100vh - 80px);
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  width:100%;
  max-width:420px;
  background:rgba(15,15,35,0.65);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:35px;
  padding:30px 20px;
  text-align:center;
}

input{
  width:100%;
  height:58px;
  border:none;
  outline:none;
  border-radius:18px;
  background:rgba(255,255,255,0.08);
  color:white;
  font-size:18px;
  text-align:center;
}

.buzzer{
  width:230px;
  height:230px;
  border:none;
  border-radius:50%;
  margin-top:35px;
  font-size:34px;
  font-weight:900;
  font-family:'Orbitron';
  color:white;
  cursor:pointer;
  background:linear-gradient(145deg,#00f0ff,#0066ff);
  box-shadow:0 0 30px #00f0ff;
}

#status{
  margin-top:25px;
  font-size:26px;
  font-weight:700;
}

.klasemen{
  position:fixed;
  top:90px;
  right:15px;
  width:180px;
  padding:12px;
  background:rgba(15,15,35,0.78);
  border-radius:22px;
  backdrop-filter:blur(18px);
}

.player-name{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  margin-bottom:4px;
}

.bar{
  width:100%;
  height:10px;
  background:rgba(255,255,255,0.08);
  border-radius:20px;
  overflow:hidden;
}

.fill{
  height:100%;
  background:linear-gradient(90deg,#00f0ff,#ff00d4);
}
</style>
</head>

<body>

<div class="topbar">RM KEMANG GAMES</div>

<div class="klasemen">
<h2>🏆 TOP PLAYER</h2>
<div id="ranking"></div>
</div>

<div class="container">
<div class="card">

<input type="text" id="nama" placeholder="MASUKKAN NAMA DISINI !">

<button id="btn" class="buzzer">TAP!</button>

<h2 id="status">🔥 SIAPKAN JARI!</h2>

</div>
</div>

<script>
// FIREBASE
const firebaseConfig = {
  apiKey:"AIzaSyXXXX",
  authDomain:"game-aldi.firebaseapp.com",
  databaseURL:"https://game-aldi-default-rtdb.asia-southeast1.firebasedatabase.app"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const btn = document.getElementById("btn");
const status = document.getElementById("status");

let namaPlayer = "";

// BUZZER
btn.onclick = async function(){

  const nama = document.getElementById("nama").value.trim();
  if(!nama){
    alert("Isi nama!");
    return;
  }

  namaPlayer = nama;
  btn.disabled = true;

  await db.ref("game").transaction((current)=>{

    if(!current || current.clicked !== true){
      return {
        clicked:true,
        player:nama,
        timestamp:Date.now()
      };
    }

    return;
  });

};

// GAME REALTIME
db.ref("game").on("value", snap => {

  const data = snap.val();

  if(!data){
    reset();
    return;
  }

  if(data.clicked){

    btn.disabled = true;

    if(data.player === namaPlayer){
      status.innerHTML = "✅ KAMU BOLEH JAWAB!";
    } else {
      status.innerHTML = "❌ KALAH CEPAT DARI <br>" + data.player;
    }

  } else {
    reset();
  }

});

function reset(){
  btn.disabled = false;
  status.innerHTML = "🔥 SIAPKAN JARI!";
}

// ================= LEADERBOARD FIX FULL
db.ref("ranking").on("value", snap => {

  const data = snap.val() || {};

  let arr = [];

  for(let nama in data){

    let scoreValue = 0;

    if(typeof data[nama] === "number"){
      scoreValue = data[nama];
    } else if(typeof data[nama] === "object"){
      scoreValue = data[nama]?.score || 0;
    }

    arr.push({
      nama,
      score: scoreValue
    });

  }

  arr.sort((a,b)=>b.score-a.score);

  let max = arr[0]?.score || 1;

  let html = "";

  arr.forEach((p,i)=>{

    let persen = (p.score / max) * 100;

    html += `
    <div>
      <div class="player-name">
        <span>${i+1}. ${p.nama}</span>
        <span>${p.score}</span>
      </div>
      <div class="bar">
        <div class="fill" style="width:${persen}%"></div>
      </div>
    </div>`;
  });

  document.getElementById("ranking").innerHTML = html;

});

</script>

</body>
</html>
