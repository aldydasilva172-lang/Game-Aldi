<style>

/* ================================================= */
/* GLOBAL */
/* ================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
}

body{

  font-family:'Poppins',sans-serif;

  min-height:100vh;

  overflow:hidden;

  color:#17345f;

  background:

  radial-gradient(
    circle at 10% 10%,
    rgba(52,152,255,.12),
    transparent 30%
  ),

  radial-gradient(
    circle at 90% 85%,
    rgba(72,180,255,.10),
    transparent 30%
  ),

  linear-gradient(
    135deg,
    #ffffff 0%,
    #f7fbff 48%,
    #eef7ff 100%
  );

}


/* ================================================= */
/* SOFT BACKGROUND */
/* ================================================= */

body::before{

  content:'';

  position:fixed;

  width:380px;

  height:380px;

  border-radius:50%;

  background:
  rgba(30,145,255,.08);

  filter:blur(90px);

  top:-180px;

  left:-150px;

  pointer-events:none;

  z-index:0;

}


body::after{

  content:'';

  position:fixed;

  width:400px;

  height:400px;

  border-radius:50%;

  background:
  rgba(110,190,255,.08);

  filter:blur(100px);

  right:-180px;

  bottom:-180px;

  pointer-events:none;

  z-index:0;

}


/* ================================================= */
/* HEADER */
/* ================================================= */

.topbar{

  width:100%;

  height:78px;

  padding:17px 20px;

  display:flex;

  justify-content:center;

  align-items:center;

  position:relative;

  z-index:10;

  font-family:'Orbitron',sans-serif;

  font-size:25px;

  font-weight:900;

  letter-spacing:2px;

  color:#17477f;

  background:
  rgba(255,255,255,.76);

  backdrop-filter:blur(20px);

  -webkit-backdrop-filter:blur(20px);

  border-bottom:
  1px solid rgba(40,120,200,.10);

  box-shadow:
  0 5px 25px rgba(25,100,170,.07);

  text-shadow:
  0 3px 15px rgba(30,130,255,.12);

}


/* ================================================= */
/* CONTAINER */
/* ================================================= */

.container{

  width:100%;

  height:calc(100vh - 78px);

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  padding:20px;

  position:relative;

  z-index:2;

}


/* ================================================= */
/* CARD */
/* ================================================= */

.card{

  width:100%;

  max-width:420px;

  position:relative;

  overflow:visible;

  padding:30px 20px;

  text-align:center;

  border-radius:32px;

  background:
  rgba(255,255,255,.72);

  backdrop-filter:blur(22px);

  -webkit-backdrop-filter:blur(22px);

  border:
  1px solid rgba(60,130,200,.12);

  box-shadow:

  0 20px 55px rgba(25,90,150,.10),

  inset 0 1px 0 rgba(255,255,255,.9);

}


/* ================================================= */
/* INPUT */
/* ================================================= */

input{

  width:100%;

  height:58px;

  border:none;

  outline:none;

  border-radius:17px;

  background:
  rgba(244,249,255,.92);

  color:#17345f;

  font-size:17px;

  text-align:center;

  border:
  1px solid rgba(40,120,210,.13);

  box-shadow:
  inset 0 2px 8px rgba(40,100,160,.04);

  transition:.3s;

}


input:focus{

  border:
  1px solid rgba(20,130,255,.55);

  background:#fff;

  box-shadow:
  0 0 0 4px rgba(30,145,255,.08),
  0 8px 20px rgba(30,130,230,.08);

}


input::placeholder{

  color:#91a4ba;

}


/* ================================================= */
/* BUZZER WRAP */
/* ================================================= */

.buzzer-wrap{

  display:flex;

  justify-content:center;

  align-items:center;

  margin-top:20px;

}


/* ================================================= */
/* BUZZER */
/* ================================================= */

.buzzer{

  width:230px;

  height:230px;

  border:none;

  border-radius:50%;

  cursor:pointer;

  position:relative;

  overflow:hidden;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  gap:4px;

  font-family:'Poppins',sans-serif;

  font-size:30px;

  font-weight:900;

  color:white;

  background:

  linear-gradient(
    145deg,
    #3baeff 0%,
    #1688f5 50%,
    #0873dc 100%
  );

  box-shadow:

  0 12px 30px rgba(25,130,235,.25),

  0 0 0 7px rgba(70,165,255,.08),

  inset 0 4px 8px rgba(255,255,255,.35),

  inset 0 -12px 20px rgba(0,70,150,.18);

  transition:

  transform .18s ease,

  box-shadow .25s ease,

  background .3s ease;

  -webkit-tap-highlight-color:transparent;

}


.buzzer:hover{

  transform:scale(1.025);

  box-shadow:

  0 15px 38px rgba(25,130,235,.30),

  0 0 0 8px rgba(70,165,255,.10),

  inset 0 4px 8px rgba(255,255,255,.38),

  inset 0 -12px 20px rgba(0,70,150,.18);

}


.buzzer:active{

  transform:scale(.94);

}


/* ================================================= */
/* EMOJI */
/* ================================================= */

.buzzer-emoji{

  font-family:
  "Apple Color Emoji",
  "Segoe UI Emoji",
  "Noto Color Emoji",
  sans-serif;

  font-size:108px;

  line-height:.95;

  display:block;

  filter:
  drop-shadow(
    0 5px 8px rgba(0,0,0,.16)
  );

  transform:translateY(-2px);

  transition:

  transform .25s ease,

  filter .25s ease;

}


/* ================================================= */
/* TAP TEXT */
/* ================================================= */

.buzzer-text{

  display:block;

  font-family:'Orbitron',sans-serif;

  font-size:25px;

  font-weight:900;

  letter-spacing:1px;

  line-height:1;

  text-shadow:
  0 3px 8px rgba(0,70,150,.25);

}


/* ================================================= */
/* SHINE */
/* ================================================= */

.buzzer::before{

  content:'';

  position:absolute;

  width:55%;

  height:150%;

  top:-25%;

  left:-90%;

  transform:rotate(20deg);

  background:

  linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.32),
    transparent
  );

  animation:
  shine 4s infinite;

  pointer-events:none;

}


@keyframes shine{

  0%{
    left:-90%;
  }

  35%,
  100%{
    left:140%;
  }

}


/* ================================================= */
/* STATUS */
/* ================================================= */

#status{

  margin-top:26px;

  min-height:70px;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:22px;

  font-weight:700;

  line-height:1.45;

  color:#24486f;

  text-shadow:
  0 2px 12px rgba(30,100,160,.08);

}


/* ================================================= */
/* SPAM */
/* ================================================= */

.buzzer.spam{

  background:

  linear-gradient(
    145deg,
    #ff6464,
    #ef3030 50%,
    #d71919
  ) !important;

  box-shadow:

  0 14px 35px rgba(230,30,30,.28),

  0 0 0 8px rgba(255,50,50,.08),

  0 0 35px rgba(255,50,50,.20),

  inset 0 4px 8px rgba(255,255,255,.28),

  inset 0 -14px 20px rgba(120,0,0,.18) !important;

  cursor:not-allowed;

  animation:
  spamPulse 1.1s infinite;

}


@keyframes spamPulse{

  0%,
  100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.025);
  }

}


#spamText{

  margin-top:13px;

  color:#e52828;

  font-family:'Orbitron',sans-serif;

  font-size:16px;

  font-weight:900;

  letter-spacing:.5px;

  text-shadow:
  0 4px 15px rgba(230,30,30,.15);

}


/* ================================================= */
/* WINNER */
/* ================================================= */

.buzzer.win{

  background:

  linear-gradient(
    145deg,
    #54dfad,
    #18c98b 50%,
    #0eae76
  ) !important;

  box-shadow:

  0 15px 38px rgba(20,190,130,.25),

  0 0 0 8px rgba(35,210,145,.08),

  inset 0 4px 8px rgba(255,255,255,.34),

  inset 0 -14px 20px rgba(0,100,65,.16);

}


.buzzer.win .buzzer-emoji{

  animation:
  winnerPop .45s ease;

}


@keyframes winnerPop{

  0%{
    transform:scale(.65) rotate(-8deg);
  }

  60%{
    transform:scale(1.12) rotate(4deg);
  }

  100%{
    transform:scale(1);
  }

}


/* ================================================= */
/* LOSER */
/* ================================================= */

.buzzer.lose{

  background:

  linear-gradient(
    145deg,
    #ff9c68,
    #ff7043 50%,
    #ed4b28
  ) !important;

  box-shadow:

  0 15px 38px rgba(240,90,40,.22),

  0 0 0 8px rgba(255,120,60,.07),

  inset 0 4px 8px rgba(255,255,255,.32),

  inset 0 -14px 20px rgba(120,40,0,.15);

}


.buzzer.lose .buzzer-emoji{

  animation:
  loserShake .42s ease;

}


@keyframes loserShake{

  0%,
  100%{
    transform:rotate(0);
  }

  20%{
    transform:rotate(-8deg);
  }

  40%{
    transform:rotate(8deg);
  }

  60%{
    transform:rotate(-6deg);
  }

  80%{
    transform:rotate(5deg);
  }

}


/* ================================================= */
/* READY */
/* ================================================= */

.buzzer.ready{

  background:

  linear-gradient(
    145deg,
    #42b5ff,
    #168df2 50%,
    #0873dc
  );

}


/* ================================================= */
/* KLASMEN */
/* ================================================= */

.klasemen{

  position:fixed;

  bottom:15px;

  right:15px;

  width:min(190px,45vw);

  max-width:205px;

  min-width:145px;

  padding:14px;

  border-radius:22px;

  background:
  rgba(255,255,255,.84);

  backdrop-filter:blur(20px);

  -webkit-backdrop-filter:blur(20px);

  border:
  1px solid rgba(40,120,200,.12);

  box-shadow:

  0 15px 35px rgba(30,100,160,.12),

  inset 0 1px 0 rgba(255,255,255,.9);

  z-index:9999;

  cursor:grab;

  touch-action:none;

  user-select:none;

  transition:

  box-shadow .2s,

  transform .15s;

}


.klasemen:active{

  cursor:grabbing;

}


.klasemen h2{

  font-size:12px;

}


.player{

.bar{

  height:8px;

  background:
  #eaf2fa;

.fill{

/* ================================================= */
/* FOOTER */
/* ================================================= */

.footer{

/* ================================================= */
/* LOGIN */
/* ================================================= */

.login-screen{

  position:fixed;

  inset:0;

  display:flex;

  justify-content:center;

  align-items:center;

  padding:20px;

  background:

    135deg,

    rgba(241,248,255,.96)
  );

  backdrop-filter:blur(18px);

  -webkit-backdrop-filter:blur(18px);

  z-index:99999;

}


.login-box{

  width:90%;

  max-width:370px;

  padding:34px 28px;

  border-radius:30px;

  background:
  rgba(255,255,255,.80);

  backdrop-filter:blur(25px);

  -webkit-backdrop-filter:blur(25px);

  border:
  1px solid rgba(40,120,200,.13);

  text-align:center;

  box-shadow:

  0 25px 70px rgba(30,100,160,.14),

}


.login-box h1{

.login-box p{

.login-box button{

  width:100%;

  height:55px;

  margin-top:15px;

  border:none;

  border-radius:16px;

  font-size:17px;

  font-weight:700;

  font-family:'Poppins',sans-serif;

  background:

  linear-gradient(
    145deg,
    #39adff,
    #087bea
  );

  color:white;

  cursor:pointer;

  box-shadow:

  0 10px 25px rgba(20,125,230,.22),

  inset 0 2px 5px rgba(255,255,255,.28);

  transition:.2s;

}


.login-box button:active{

  transform:scale(.97);

}


.login-box button:disabled{

/* ================================================= */
/* LOGIN STATUS */
/* ================================================= */

#loginStatus{

  margin-top:18px;

  font-size:14px;

/* ================================================= */
/* HIDDEN */

.hidden{

  display:none !important;

}


/* ================================================= */
/* MOBILE */
/* ================================================= */

@media(max-width:600px){

  .topbar{

    height:68px;

  }

  }

  }

@media(max-height:700px){

  .buzzer{

  }

<body>


<!-- LOGIN -->

<div
id="loginScreen"
class="login-screen"
>

  <div class="login-box">

    <h1>
      🎮 RM KEMANG GAMES
    </h1>

    <p>
      Masukkan nama untuk mulai bermain
    </p>

    <input
      type="text"
      id="loginNama"
      placeholder="Nama Kamu"
      autocomplete="off"
    >

    <button
      id="mulaiBtn"
    >
      MULAI GAME
    </button>

    <div
      id="loginStatus"
    ></div>

  </div>

</div>


<!-- HEADER -->

<div class="topbar">

  RM KEMANG GAMES

</div>


<!-- MINI KLASMEN -->

<div class="klasemen">

  <h2>
    🏆 TOP PLAYER
  </h2>

  <div id="ranking"></div>

</div>


<!-- GAME -->

<div class="container">

  <div class="card">

    <div class="buzzer-wrap">

      <button
        id="btn"
        class="buzzer ready"
      >

        <span class="buzzer-emoji">
          😎
        </span>

        <span class="buzzer-text">
          TAP!
        </span>

      </button>

    </div>


    <div id="spamText"></div>


    <h2 id="status">

      🔥 SIAPKAN JARI!

    </h2>


    <div class="footer">

      OUTING RANCH MARKET 2026

    </div>

  </div>

</div>


<script>


// =================================================
// FIREBASE
// =================================================

const firebaseConfig = {

  apiKey:
  "AIzaSyD36RSQ5epRBSbeI9JnEkI2UevOg921xrI4",

  authDomain:
  "game-aldi.firebaseapp.com",

  databaseURL:
  "https://game-aldi-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
  "game-aldi",

  storageBucket:
  "game-aldi.firebasestorage.app",

  messagingSenderId:
  "184345142676",

  appId:
  "1:184345142676:web:f19d19999c897d0ca95b81"

};


firebase.initializeApp(firebaseConfig);


const db =
firebase.database();


// =================================================
// ELEMENT
// =================================================

const btn =
document.getElementById("btn");

const status =
document.getElementById("status");

const loginScreen =
document.getElementById("loginScreen");

const loginNama =
document.getElementById("loginNama");

const mulaiBtn =
document.getElementById("mulaiBtn");

const loginStatus =
document.getElementById("loginStatus");

const spamText =
document.getElementById("spamText");


// =================================================
// PLAYER ID
// =================================================

function buatPlayerID(){

  return (
    "player_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,8)
  );

}


let playerID =
localStorage.getItem(
  "rmKemangPlayerID"
);


if(!playerID){

  playerID =
    buatPlayerID();


  localStorage.setItem(
    "rmKemangPlayerID",
    playerID
  );

}


let namaPlayer = "";

let playerStatus = "";

let playerSpam = false;

let buzzerLocked = false;

let lastClickTime = 0;


// =================================================
// ANTI SPAM
// =================================================

const SPAM_DELAY = 2000;

const CLICK_DELAY = 700;


// =================================================
// PLAYER LISTENER
// =================================================

let playerRef = null;
let playerListener = null;


function pasangPlayerListener(){

  if(playerRef && playerListener){

    playerRef.off(
      "value",
      playerListener
    );

  }


  playerRef =
    db.ref(
      "players/" +
      playerID
    );


  playerListener =
    snap => {

      const data =
        snap.val();


      // =========================================
      // DATA PLAYER TIDAK ADA
      // RESET PEMAIN
      // =========================================

      if(!data){

        namaPlayer = "";

        playerStatus = "";

        playerSpam = false;

        buzzerLocked = true;

        lastClickTime = 0;


        loginScreen
          .classList
          .remove("hidden");


        loginNama.value = "";

        loginNama.disabled = false;


        mulaiBtn.disabled = false;


        loginStatus.innerHTML =
          "👤 MASUKKAN NAMA UNTUK BERMAIN";


        btn.disabled = true;

        btn.style.pointerEvents =
          "none";


        btn.classList
          .remove("spam");


        spamText.innerHTML = "";


        btn.style.background =
          "linear-gradient(145deg,#42b5ff,#168df2 50%,#0873dc)";


        status.innerHTML =
          "👤 MASUKKAN NAMA";


        return;

      }


      // =========================================
      // DATA PLAYER ADA
      // =========================================

      namaPlayer =
        data.name ||
        namaPlayer;


      playerStatus =
        data.status;


      playerSpam =
        data.spam === true;


      // =========================================
      // SPAM
      // =========================================

      if(playerSpam){

        buzzerLocked = true;


        btn.disabled = false;

        btn.style.pointerEvents =
          "auto";


        btn.classList
          .add("spam");


        spamText.innerHTML =
          "⚠ SPAM!";


        status.innerHTML =
          "⛔ MENUNGGU RESET GAME";


        return;

      }


      // =========================================
      // PENDING
      // =========================================

      if(
        data.status === "pending"
      ){

        loginScreen
          .classList
          .remove("hidden");


        loginNama.value =
          namaPlayer;


        loginNama.disabled =
          true;


        mulaiBtn.disabled =
          true;


        loginStatus.innerHTML =
          "⏳ MENUNGGU PERSETUJUAN ADMIN";


        btn.disabled =
          true;


        btn.style.pointerEvents =
          "none";


        btn.classList
          .remove("spam");


        spamText.innerHTML =
          "";


        status.innerHTML =
          "⏳ MENUNGGU PERSETUJUAN ADMIN";


        buzzerLocked =
          true;


        return;

      }


      // =========================================
      // APPROVED
      // =========================================

      if(
        data.status === "approved"
      ){

        loginScreen
          .classList
          .add("hidden");


        btn.disabled =
          false;


        btn.style.pointerEvents =
          "auto";


        btn.classList
          .remove("spam");


        spamText.innerHTML =
          "";


        buzzerLocked =
          false;


        if(
          !window.currentGameData ||
          window.currentGameData.clicked !== true
        ){

          status.innerHTML =
            "🔥 SIAPKAN JARI!";

        }

      }

    };


  playerRef.on(
    "value",
    playerListener
  );

}

// =================================================
// BUZZER
// =================================================

btn.addEventListener(
  "click",
  async function(){

    const now =
      Date.now();


    // =============================================
    // SPAM SUDAH AKTIF
    // =============================================

    if(playerSpam){

      return;

    }


    // =============================================
    // BELUM APPROVED
    // =============================================

    if(
      playerStatus !== "approved"
    ){

      return;

    }


    // =============================================
    // DOUBLE TAP ≤ 2 DETIK
    // =============================================

    if(
      lastClickTime > 0 &&
      now - lastClickTime <= SPAM_DELAY
    ){

      playerSpam = true;

      buzzerLocked = true;


      btn.disabled =
        false;


      btn.style.pointerEvents =
        "auto";


      btn.classList
        .add("spam");


      spamText.innerHTML =
        "⚠ SPAM!";


      status.innerHTML =
        "⛔ MENUNGGU RESET GAME";


      try{

        await db.ref(
          "players/" +
          playerID +
          "/spam"
        )
        .set(true);

      }

      catch(error){

        console.log(error);

      }


      return;

    }


    // =============================================
    // KLIK NORMAL
    // =============================================

    if(
      buzzerLocked
    ){

      return;

    }


    if(
      btn.disabled
    ){

      return;

    }


    lastClickTime =
      now;


    buzzerLocked =
      true;


    /*
      Tombol sengaja tetap menerima
      tap berikutnya agar double tap
      bisa dideteksi sebagai SPAM.
    */

    btn.disabled =
      false;

    btn.style.pointerEvents =
      "auto";


    try{

      await db.ref("game")
      .transaction(
        current => {

          if(

            current === null ||

            current.clicked !== true

          ){

            return {

              clicked:
                true,

              player:
                namaPlayer,

              playerID:
                playerID,

              timestamp:
                Date.now()

            };

          }


          return;

        }
      );

    }

    catch(error){

      console.log(error);


      buzzerLocked =
        false;

    }

  }
);


// =================================================
// GAME REALTIME
// =================================================

window.currentGameData = null;


db.ref("game")
.on(
  "value",
  snap => {

    const data =
      snap.val();


    window.currentGameData =
      data;


    // =============================================
    // RESET GAME
    // =============================================

    if(!data){

      resetGameUI();

      return;

    }


    // =============================================
    // JIKA SPAM
    // =============================================

    if(playerSpam){

      btn.disabled =
        false;


      btn.style.pointerEvents =
        "auto";


      btn.classList
        .add("spam");


      spamText.innerHTML =
        "⚠ SPAM!";


      status.innerHTML =
        "⛔ MENUNGGU RESET GAME";


      buzzerLocked =
        true;


      return;

    }


    // =============================================
    // GAME SUDAH PUNYA PEMENANG
    // =============================================

    if(
      data.clicked === true
    ){

      /*
        Jangan disable tombol total.

        Kita masih membutuhkan tombol
        untuk mendeteksi double tap.
      */

      btn.disabled =
        false;


      btn.style.pointerEvents =
        "auto";


      buzzerLocked =
        false;


      const winner =
        data.player;


      // =========================================
      // SAYA PEMENANG
      // =========================================

      if(
        data.playerID === playerID
      ){

        status.innerHTML =
          "KAMU BOLEH JAWAB!✅";


        btn.classList
          .remove("spam");


        spamText.innerHTML =
          "";


        btn.style.background =
          "linear-gradient(145deg,#54dfad,#18c98b 50%,#0eae76)";


        if(
          navigator.vibrate
        ){

          navigator.vibrate([
            200,
            100,
            200
          ]);

        }

      }


      // =========================================
      // PEMAIN LAIN
      // =========================================

      else{

        status.innerHTML =
          `KAMU KALAH CEPAT DARI ❌<br>${escapeHTML(winner)}`;


        btn.classList
          .remove("spam");


        spamText.innerHTML =
          "";


        btn.style.background =
          "linear-gradient(145deg,#ff9c68,#ff7043 50%,#ed4b28)";

      }

    }

  }
);


// =================================================
// RESET GAME UI
// =================================================

function resetGameUI(){

  /*
    Kalau belum approved,
    jangan aktifkan buzzer.
  */

  if(
    playerStatus !== "approved"
  ){

    return;

  }


  /*
    Kalau masih SPAM,
    tetap terkunci.
  */

  if(playerSpam){

    btn.disabled =
      false;


    btn.style.pointerEvents =
      "auto";


    btn.classList
      .add("spam");


    spamText.innerHTML =
      "⚠ SPAM!";


    status.innerHTML =
      "⛔ MENUNGGU RESET GAME";


    buzzerLocked =
      true;


    return;

  }


  buzzerLocked =
    false;


  lastClickTime =
    0;


  btn.disabled =
    false;


  btn.style.pointerEvents =
    "auto";


  btn.classList
    .remove("spam");


  spamText.innerHTML =
    "";


  btn.style.background =
    "linear-gradient(145deg,#42b5ff,#168df2 50%,#0873dc)";


  status.innerHTML =
    "🔥 SIAPKAN JARI!";

}


// =================================================
// RANKING
// =================================================

db.ref("ranking")
.on(
  "value",
  snap => {

    const data =
      snap.val() || {};


    let arr = [];


    for(
      let nama in data
    ){

      arr.push({

        nama:
          data[nama].name ||
          nama,

        score:
          data[nama].score ||
          0

      });

    }


    arr.sort(
      (a,b) =>
        b.score - a.score
    );


    let max =
      arr[0]
        ? arr[0].score
        : 1;


    let html = "";


    arr.forEach(
      (item,index) => {

        let persen =
          (item.score / max) *
          100;


        html += `

        <div class="player">

          <div class="player-name">

            <span>
              ${escapeHTML(item.nama)}
            </span>

            <span>
              ${item.score}
            </span>

          </div>

          <div class="bar">

            <div
              class="fill"
              style="width:${persen}%"
            ></div>

          </div>

        </div>

        `;

      }
    );


    document
      .getElementById("ranking")
      .innerHTML =
        html;

  }
);


// =================================================
// ESCAPE HTML
// =================================================

function escapeHTML(text){

  const div =
    document.createElement("div");


  div.textContent =
    text || "";


  return div.innerHTML;

}

// =================================================
// DRAG KLASMEN
// =================================================

const klasemen =
document.querySelector(
  ".klasemen"
);


let isDragging =
  false;

let offsetX =
  0;

let offsetY =
  0;


let startX =
  window.innerWidth -
  210;


let startY =
  window.innerHeight -
  230;


klasemen.style.left =
  startX + "px";


klasemen.style.top =
  startY + "px";


klasemen.style.right =
  "auto";


klasemen.style.bottom =
  "auto";


function dragStart(x,y){

  isDragging =
    true;


  const rect =
    klasemen.getBoundingClientRect();


  offsetX =
    x - rect.left;


  offsetY =
    y - rect.top;

}


function dragMove(x,y){

  if(!isDragging)
    return;


  let newX =
    x - offsetX;


  let newY =
    y - offsetY;


  const maxX =
    window.innerWidth -
    klasemen.offsetWidth;


  const maxY =
    window.innerHeight -
    klasemen.offsetHeight;


  newX =
    Math.max(
      0,
      Math.min(
        newX,
        maxX
      )
    );


  newY =
    Math.max(
      0,
      Math.min(
        newY,
        maxY
      )
    );


  klasemen.style.left =
    newX + "px";


  klasemen.style.top =
    newY + "px";

}


function dragEnd(){

  isDragging =
    false;

}


// =================================================
// TOUCH
// =================================================

klasemen.addEventListener(
  "touchstart",
  e => {

    const t =
      e.touches[0];


    dragStart(
      t.clientX,
      t.clientY
    );

  }
);


document.addEventListener(
  "touchmove",
  e => {

    if(!isDragging)
      return;


    const t =
      e.touches[0];


    dragMove(
      t.clientX,
      t.clientY
    );


    e.preventDefault();

  },
  {
    passive:false
  }
);


document.addEventListener(
  "touchend",
  dragEnd
);


// =================================================
// MOUSE
// =================================================

klasemen.addEventListener(
  "mousedown",
  e => {

    dragStart(
      e.clientX,
      e.clientY
    );

  }
);


document.addEventListener(
  "mousemove",
  e => {

    dragMove(
      e.clientX,
      e.clientY
    );

  }
);


document.addEventListener(
  "mouseup",
  dragEnd
);


// =================================================
// VISUAL BUTTON ONLY
// =================================================
// Bagian ini hanya mengatur tampilan tombol.
// Tidak mengubah Firebase, game, ranking,
// login, spam, reset, atau sistem pemenang.

function updateButtonVisual(){

  const text =
    status.innerText
      .toUpperCase();


  const emoji =
    btn.querySelector(
      ".buzzer-emoji"
    );

  const tapText =
    btn.querySelector(
      ".buzzer-text"
    );


  if(!emoji || !tapText)
    return;


  // =============================================
  // SPAM
  // =============================================

  if(
    playerSpam ||
    text.includes("SPAM")
  ){

    btn.classList
      .remove(
        "ready",
        "win",
        "lose"
      );

    btn.classList
      .add("spam");

    emoji.innerHTML =
      "😡";

    tapText.innerHTML =
      "";

    return;

  }


  // =============================================
  // MENANG
  // =============================================

  if(
    text.includes("KAMU BOLEH JAWAB")
  ){

    btn.classList
      .remove(
        "ready",
        "lose",
        "spam"
      );

    btn.classList
      .add("win");

    emoji.innerHTML =
      "🥶";

    tapText.innerHTML =
      "";

    return;

  }


  // =============================================
  // KALAH
  // =============================================

  if(
    text.includes("KAMU KALAH CEPAT")
  ){

    btn.classList
      .remove(
        "ready",
        "win",
        "spam"
      );

    btn.classList
      .add("lose");

    emoji.innerHTML =
      "🤪";

    tapText.innerHTML =
      "";

    return;

  }


  // =============================================
  // READY
  // =============================================

  if(
    text.includes("SIAPKAN JARI") ||
    text.includes("MASUKKAN NAMA")
  ){

    btn.classList
      .remove(
        "win",
        "lose",
        "spam"
      );

    btn.classList
      .add("ready");

    emoji.innerHTML =
      "😎";

    tapText.innerHTML =
      "TAP!";

  }

}
