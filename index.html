<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>RM KEMANG GAMES - Maintenance</title>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<style>

/* ================================================= */
/* GLOBAL */
/* ================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  font-family:'Poppins',sans-serif;
  background:
    radial-gradient(
      circle at top left,
      rgba(0,255,255,.14),
      transparent 35%
    ),
    radial-gradient(
      circle at bottom right,
      rgba(0,120,255,.16),
      transparent 40%
    ),
    linear-gradient(
      135deg,
      #020617,
      #07111f,
      #020617
    );

  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}


/* ================================================= */
/* BACKGROUND */
/* ================================================= */

.background{
  position:fixed;
  inset:0;
  pointer-events:none;
}

.background::before{
  content:"";
  position:absolute;
  width:320px;
  height:320px;

  top:-120px;
  left:-100px;

  border-radius:50%;

  background:rgba(0,255,255,.10);

  filter:blur(70px);

  animation:float1 7s ease-in-out infinite;
}

.background::after{
  content:"";
  position:absolute;
  width:350px;
  height:350px;

  right:-130px;
  bottom:-140px;

  border-radius:50%;

  background:rgba(0,120,255,.12);

  filter:blur(80px);

  animation:float2 8s ease-in-out infinite;
}

@keyframes float1{
  0%,100%{
    transform:translate(0,0);
  }

  50%{
    transform:translate(50px,40px);
  }
}

@keyframes float2{
  0%,100%{
    transform:translate(0,0);
  }

  50%{
    transform:translate(-40px,-50px);
  }
}


/* ================================================= */
/* CONTAINER */
/* ================================================= */

.container{
  position:relative;

  width:calc(100% - 32px);
  max-width:520px;

  padding:42px 28px 34px;

  text-align:center;

  border:1px solid rgba(255,255,255,.13);

  border-radius:28px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.035)
    );

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  box-shadow:
    0 25px 70px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.10);

  z-index:2;

  animation:containerIn .8s ease;
}

@keyframes containerIn{

  from{
    opacity:0;
    transform:translateY(25px) scale(.96);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }

}


/* ================================================= */
/* LOGO */
/* ================================================= */

.logo{
  width:88px;
  height:88px;

  margin:0 auto 20px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:42px;

  background:
    linear-gradient(
      135deg,
      rgba(0,255,255,.18),
      rgba(0,110,255,.15)
    );

  border:1px solid rgba(255,255,255,.18);

  box-shadow:
    0 0 35px rgba(0,220,255,.18),
    inset 0 0 20px rgba(255,255,255,.04);

  animation:pulse 2.5s ease-in-out infinite;
}

@keyframes pulse{

  0%,100%{
    transform:scale(1);
    box-shadow:
      0 0 30px rgba(0,220,255,.15),
      inset 0 0 20px rgba(255,255,255,.04);
  }

  50%{
    transform:scale(1.05);
    box-shadow:
      0 0 45px rgba(0,220,255,.30),
      inset 0 0 25px rgba(255,255,255,.06);
  }

}


/* ================================================= */
/* TITLE */
/* ================================================= */

.brand{
  font-size:13px;

  font-weight:600;

  letter-spacing:4px;

  color:rgba(255,255,255,.65);

  margin-bottom:8px;
}

h1{
  font-size:34px;

  font-weight:800;

  letter-spacing:1px;

  line-height:1.2;

  background:
    linear-gradient(
      90deg,
      #ffffff,
      #7eeeff,
      #ffffff
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;

  margin-bottom:12px;
}

.subtitle{
  font-size:14px;

  line-height:1.7;

  color:rgba(255,255,255,.68);

  max-width:400px;

  margin:auto;
}


/* ================================================= */
/* MAINTENANCE BOX */
/* ================================================= */

.maintenance-box{
  margin-top:28px;

  padding:22px 18px;

  border-radius:20px;

  background:
    rgba(0,0,0,.22);

  border:1px solid rgba(255,255,255,.10);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05);
}

.status{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  gap:9px;

  padding:8px 15px;

  border-radius:999px;

  font-size:11px;

  font-weight:700;

  letter-spacing:1px;

  color:#8ff7ff;

  background:rgba(0,220,255,.08);

  border:1px solid rgba(0,220,255,.20);
}

.status-dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:#00eaff;

  box-shadow:
    0 0 12px #00eaff;

  animation:blink 1.3s infinite;
}

@keyframes blink{

  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.25;
  }

}

.message{
  margin-top:18px;

  font-size:15px;

  font-weight:500;

  color:white;

  line-height:1.6;
}

.detail{
  margin-top:8px;

  font-size:12px;

  line-height:1.7;

  color:rgba(255,255,255,.52);
}


/* ================================================= */
/* LOADING */
/* ================================================= */

.loading{
  margin:25px auto 0;

  width:170px;
  height:4px;

  overflow:hidden;

  border-radius:10px;

  background:rgba(255,255,255,.08);
}

.loading-bar{
  width:55%;
  height:100%;

  border-radius:10px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #00eaff,
      transparent
    );

  animation:loading 1.6s ease-in-out infinite;
}

@keyframes loading{

  0%{
    transform:translateX(-180%);
  }

  100%{
    transform:translateX(320%);
  }

}


/* ================================================= */
/* FOOTER */
/* ================================================= */

.footer{
  margin-top:28px;

  font-size:10px;

  color:rgba(255,255,255,.35);

  letter-spacing:1px;
}


/* ================================================= */
/* MOBILE */
/* ================================================= */

@media(max-width:480px){

  .container{
    width:calc(100% - 24px);

    padding:
      34px 20px
      28px;
      
    border-radius:24px;
  }

  .logo{
    width:76px;
    height:76px;

    font-size:35px;

    margin-bottom:17px;
  }

  .brand{
    font-size:11px;
    letter-spacing:3px;
  }

  h1{
    font-size:28px;
  }

  .subtitle{
    font-size:13px;
  }

  .maintenance-box{
    margin-top:24px;
    padding:19px 15px;
  }

  .message{
    font-size:14px;
  }

}


/* ================================================= */
/* VERY SMALL SCREEN */
/* ================================================= */

@media(max-height:650px){

  .container{
    padding-top:25px;
    padding-bottom:22px;
  }

  .logo{
    width:65px;
    height:65px;

    font-size:30px;

    margin-bottom:12px;
  }

  .maintenance-box{
    margin-top:18px;
  }

  .footer{
    margin-top:18px;
  }

}

</style>

</head>


<body>

<div class="background"></div>


<div class="container">

  <div class="logo">
    🎮
  </div>

  <div class="brand">
    RM KEMANG
  </div>

  <h1>
    GAMES
  </h1>

  <div class="subtitle">
    Halaman permainan sedang dalam proses
    pemeliharaan sementara.
  </div>


  <div class="maintenance-box">

    <div class="status">

      <span class="status-dot"></span>

      MAINTENANCE

    </div>


    <div class="message">

      🔧 SISTEM SEDANG DIPERBAIKI

    </div>


    <div class="detail">

      Mohon tunggu beberapa saat.<br>
      Silakan kembali lagi setelah sistem
      kembali normal.

    </div>


    <div class="loading">

      <div class="loading-bar"></div>

    </div>

  </div>


  <div class="footer">

    RM KEMANG GAMES • SYSTEM MAINTENANCE

  </div>

</div>


</body>
</html>
