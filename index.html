<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>RM KEMANG GAMES</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- CACHE OFF -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:'Poppins',sans-serif;

  min-height:100vh;

  overflow-x:hidden;

  color:white;

  background:
  linear-gradient(rgba(5,5,15,0.75),rgba(5,5,15,0.9)),
  url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1600&auto=format&fit=crop');

  background-size:cover;
  background-position:center;
  background-attachment:fixed;

}

/* GLOW EFFECT */

body::before{

  content:'';

  position:fixed;

  width:450px;
  height:450px;

  background:
  rgba(0,255,255,0.18);

  border-radius:50%;

  filter:blur(120px);

  top:-120px;
  left:-120px;

}

body::after{

  content:'';

  position:fixed;

  width:450px;
  height:450px;

  background:
  rgba(255,0,255,0.15);

  border-radius:50%;

  filter:blur(120px);

  bottom:-120px;
  right:-120px;

}

/* HEADER */

.topbar{

  width:100%;

  padding:22px;

  text-align:center;

  font-family:'Orbitron',sans-serif;

  font-size:34px;
  font-weight:900;

  letter-spacing:3px;

  background:
  rgba(255,255,255,0.05);

  backdrop-filter:blur(15px);

  border-bottom:
  1px solid rgba(255,255,255,0.1);

  text-shadow:
  0 0 20px cyan;

  box-shadow:
  0 0 25px rgba(0,255,255,0.2);

}

/* CONTAINER */

.container{

  width:100%;
  max-width:500px;

  margin:auto;

  padding:25px 18px 40px;

}

/* CARD */

.card{

  position:relative;

  overflow:hidden;

  background:
  rgba(15,15,35,0.68);

  backdrop-filter:blur(18px);

  border:
  1px solid rgba(255,255,255,0.08);

  border-radius:35px;

  padding:30px 22px;

  box-shadow:
  0 0 40px rgba(0,0,0,0.4);

}

/* INPUT */

input{

  width:100%;
  height:60px;

  border:none;
  outline:none;

  border-radius:18px;

  text-align:center;

  font-size:18px;

  color:white;

  background:
  rgba(255,255,255,0.08);

  border:
  1px solid rgba(255,255,255,0.08);

  transition:0.3s;

}

input:focus{

  border:
  1px solid cyan;

  box-shadow:
  0 0 20px cyan;

}

input::placeholder{

  color:#ccc;

}

/* BUZZER */

.buzzer-wrap{

  display:flex;

  justify-content:center;

  margin-top:35px;

}

.buzzer{

  width:230px;
  height:230px;

  border:none;

  border-radius:50%;

  cursor:pointer;

  position:relative;

  overflow:hidden;

  font-family:'Orbitron',sans-serif;

  font-size:34px;
  font-weight:900;

  color:white;

  background:
  linear-gradient(145deg,#00f0ff,#0066ff);

  box-shadow:

  0 0 30px #00f0ff,
  0 0 70px rgba(0,240,255,0.45),
  inset 0 -12px 20px rgba(0,0,0,0.35);

  transition:0.2s;

}

.buzzer:hover{

  transform:scale(1.03);

}

.buzzer:active{

  transform:scale(0.95);

}

/* SHINE */

.buzzer::before{

  content:'';

  position:absolute;

  width:100%;
  height:100%;

  background:
  linear-gradient(
  120deg,
  transparent,
  rgba(255,255,255,0.35),
  transparent);

  top:0;
  left:-100%;

  animation:shine 3s infinite;

}

@keyframes shine{

  100%{
    left:100%;
  }

}

/* STATUS */

#status{

  margin-top:30px;

  text-align:center;

  font-size:28px;
  font-weight:700;

  line-height:1.5;

  text-shadow:
  0 0 15px rgba(255,255,255,0.35);

}

/* KLASMEN */

.klasemen{

  margin-top:25px;

  background:
  rgba(15,15,35,0.68);

  backdrop-filter:blur(18px);

  border:
  1px solid rgba(255,255,255,0.08);

  border-radius:30px;

  padding:25px 18px;

  box-shadow:
  0 0 40px rgba(0,0,0,0.35);

}

.klasemen h2{

  text-align:center;

  margin-bottom:20px;

  font-family:'Orbitron',sans-serif;

  color:#00f0ff;

  text-shadow:
  0 0 10px cyan;

}

.player{

  margin-bottom:18px;

}

.player-name{

  display:flex;

  justify-content:space-between;

  margin-bottom:8px;

  font-size:15px;

  font-weight:600;

}

.bar{

  width:100%;

  height:18px;

  background:
  rgba(255,255,255,0.08);

  border-radius:30px;

  overflow:hidden;

}

.fill{

  height:100%;

  border-radius:30px;

  background:
  linear-gradient(
  90deg,
  #00f0ff,
  #8a2eff,
  #ff00d4);

  box-shadow:
  0 0 15px #00f0ff;

  transition:0.5s;

}

/* FOOTER */

.footer{

  margin-top:25px;

  text-align:center;

  font-size:13px;

  opacity:0.7;

  letter-spacing:1px;

}

/* MOBILE */

@media(max-width:600px){

  .topbar{
    font-size:28px;
  }

  .buzzer{
    width:210px;
    height:210px;
    font-size:30px;
  }

  #status{
    font-size:24px;
  }

}

</style>
</head>

<body>

<div class="topbar">
⚡ RM KEMANG GAMES
</div>

<div class="container">

<div class="card">

<input
type="text"
id="nama"
placeholder="MASUKKAN NAMA PLAYER">

<div class="buzzer-wrap">

<button
id="btn"
class="buzzer">

TAP!

</button>

</div>

<h2 id="status">
🔥 SIAPKAN JARI!
</h2>

</div>

<div class="klasemen">

<h2>🏆 RANKING PLAYER</h2>

<div id="ranking"></div>

</div>

<div class="footer">
GAME ALDI
</div>

</div>

<script>

// ================= FIREBASE
const firebaseConfig = {

  apiKey:"AIzaSyXXXX",

  authDomain:
  "game-aldi.firebaseapp.com",

  databaseURL:
  "https://game-aldi-default-rtdb.asia-southeast1.firebasedatabase.app"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const btn =
document.getElementById("btn");

const status =
document.getElementById("status");

let namaPlayer = "";


// ================= BUZZER
btn.onclick = async function(){

  const nama =
  document.getElementById("nama")
  .value.trim();

  if(!nama){

    alert("Isi nama!");
    return;

  }

  namaPlayer = nama;

  btn.disabled = true;

  try{

    await db.ref("game").transaction((current)=>{

      // HANYA SATU PEMENANG
      if(
        current === null ||
        current.clicked !== true
      ){

        return {

          clicked:true,

          player:nama,

          timestamp:Date.now()

        };

      }

      // SUDAH ADA PEMENANG
      return;

    });

  }catch(err){

    console.log(err);

    btn.disabled = false;

  }

};


// ================= REALTIME GAME
db.ref("game").on("value", snap => {

  const data = snap.val();

  if(!data){

    resetGameUI();
    return;

  }

  // ADA PEMENANG
  if(data.clicked === true){

    btn.disabled = true;

    btn.style.pointerEvents =
    "none";

    const winner =
    data.player;

    // MENANG
    if(winner === namaPlayer){

      status.innerHTML =
      "✅ KAMU MENANG!";

      btn.style.background =
      "linear-gradient(145deg,#00ff99,#00c3ff)";

      if(navigator.vibrate){

        navigator.vibrate([200,100,200]);

      }

    }

    // KALAH
    else{

      status.innerHTML =
      "❌ DIDAHULUI<br>"+winner;

      btn.style.background =
      "linear-gradient(145deg,#ff004c,#ff7a00)";

    }

  }

  // RESET
  else{

    resetGameUI();

  }

});


// ================= RESET UI
function resetGameUI(){

  btn.disabled = false;

  btn.style.pointerEvents =
  "auto";

  btn.style.background =
  "linear-gradient(145deg,#00f0ff,#0066ff)";

  status.innerHTML =
  "🔥 SIAPKAN JARI!";

}


// ================= KLASMEN
db.ref("ranking").on("value", snap => {

  const data = snap.val() || {};

  let arr = [];

  for(let nama in data){

    arr.push({

      nama:nama,
      score:data[nama]

    });

  }

  arr.sort((a,b)=>b.score-a.score);

  let max =
  arr[0] ? arr[0].score : 1;

  let html = "";

  arr.forEach((item,index)=>{

    let persen =
    (item.score/max)*100;

    html += `

    <div class="player">

      <div class="player-name">

        <span>
        ${index+1}. ${item.nama}
        </span>

        <span>
        ${item.score} PTS
        </span>

      </div>

      <div class="bar">

        <div
        class="fill"
        style="width:${persen}%">
        </div>

      </div>

    </div>

    `;

  });

  document
  .getElementById("ranking")
  .innerHTML = html;

});


// ================= AUTO RELOAD CACHE
window.onpageshow = function(event){

  if(event.persisted){

    window.location.reload();

  }

};

</script>

</body>
</html>
