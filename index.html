<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>RM KEMANG GAMES</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<!-- CACHE OFF -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<!-- THEME -->
<meta name="theme-color" content="#06111f">

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{

  font-family:'Poppins',sans-serif;

  color:white;

  background:
  linear-gradient(rgba(5,5,15,0.70),rgba(5,5,15,0.92)),
  url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1600&auto=format&fit=crop');

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  background-attachment:fixed;

  position:relative;

}

/* BACKGROUND GLOW */

body::before{

  content:'';

  position:fixed;

  width:500px;
  height:500px;

  border-radius:50%;

  background:
  rgba(0,255,255,0.15);

  filter:blur(120px);

  top:-180px;
  left:-180px;

  z-index:0;

}

body::after{

  content:'';

  position:fixed;

  width:500px;
  height:500px;

  border-radius:50%;

  background:
  rgba(255,0,200,0.13);

  filter:blur(120px);

  bottom:-180px;
  right:-180px;

  z-index:0;

}

/* APP FULLSCREEN */

.app{

  position:relative;

  z-index:2;

  width:100%;
  height:100vh;

  display:flex;
  flex-direction:column;

}

/* TOPBAR */

.topbar{

  width:100%;

  min-height:80px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  font-family:'Orbitron',sans-serif;

  font-size:34px;
  font-weight:900;

  letter-spacing:3px;

  background:
  rgba(255,255,255,0.05);

  backdrop-filter:blur(16px);

  border-bottom:
  1px solid rgba(255,255,255,0.08);

  text-shadow:
  0 0 20px cyan;

  box-shadow:
  0 0 25px rgba(0,255,255,0.15);

  flex-shrink:0;

}

/* MAIN */

.main{

  flex:1;

  width:100%;

  display:flex;

  justify-content:center;
  align-items:center;

  padding:20px;

  position:relative;

}

/* CARD FULLSCREEN */

.card{

  width:100%;
  height:100%;

  max-width:1400px;
  max-height:900px;

  border-radius:40px;

  background:
  rgba(10,15,35,0.62);

  backdrop-filter:blur(20px);

  border:
  1px solid rgba(255,255,255,0.08);

  box-shadow:
  0 0 45px rgba(0,0,0,0.45);

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  position:relative;

  overflow:hidden;

}

/* INPUT */

.input-box{

  width:100%;
  max-width:500px;

  padding:0 20px;

}

input{

  width:100%;
  height:70px;

  border:none;
  outline:none;

  border-radius:22px;

  background:
  rgba(255,255,255,0.08);

  border:
  1px solid rgba(255,255,255,0.08);

  color:white;

  text-align:center;

  font-size:22px;
  font-weight:600;

  transition:0.3s;

}

input:focus{

  border:
  1px solid cyan;

  box-shadow:
  0 0 25px cyan;

}

input::placeholder{

  color:#d7d7d7;

}

/* BUZZER */

.buzzer-wrap{

  margin-top:45px;

  display:flex;

  justify-content:center;
  align-items:center;

}

.buzzer{

  width:320px;
  height:320px;

  border:none;

  border-radius:50%;

  cursor:pointer;

  position:relative;

  overflow:hidden;

  font-family:'Orbitron',sans-serif;

  font-size:50px;
  font-weight:900;

  color:white;

  background:
  linear-gradient(145deg,#00f0ff,#0066ff);

  box-shadow:
  0 0 35px #00f0ff,
  0 0 90px rgba(0,240,255,0.45),
  inset 0 -15px 25px rgba(0,0,0,0.35);

  transition:0.15s;

}

.buzzer:hover{

  transform:scale(1.03);

}

.buzzer:active{

  transform:scale(0.94);

}

/* SHINE */

.buzzer::before{

  content:'';

  position:absolute;

  width:100%;
  height:100%;

  background:
  linear-gradient(
  120deg,
  transparent,
  rgba(255,255,255,0.35),
  transparent);

  top:0;
  left:-100%;

  animation:shine 3s infinite;

}

@keyframes shine{

  100%{
    left:100%;
  }

}

/* STATUS */

#status{

  margin-top:40px;

  font-size:42px;
  font-weight:800;

  text-align:center;

  line-height:1.5;

  text-shadow:
  0 0 20px rgba(255,255,255,0.3);

  padding:0 20px;

}

/* MINI KLASMEN */

.klasemen{

  position:absolute;

  button:20px;
  right:20px;

  width:260px;

  padding:18px;

  border-radius:28px;

  background:
  rgba(15,15,35,0.78);

  backdrop-filter:blur(18px);

  border:
  1px solid rgba(255,255,255,0.08);

  box-shadow:
  0 0 25px rgba(0,0,0,0.35);

}

.klasemen h2{

  font-size:15px;

  margin-bottom:14px;

  text-align:center;

  color:#00f0ff;

  font-family:'Orbitron',sans-serif;

  letter-spacing:1px;

}

.player{

  margin-bottom:12px;

}

.player-name{

  display:flex;

  justify-content:space-between;

  font-size:12px;

  margin-bottom:5px;

  font-weight:600;

}

.bar{

  width:100%;

  height:10px;

  background:
  rgba(255,255,255,0.08);

  border-radius:30px;

  overflow:hidden;

}

.fill{

  height:100%;

  border-radius:30px;

  background:
  linear-gradient(
  90deg,
  #00f0ff,
  #8a2eff,
  #ff00d4);

  box-shadow:
  0 0 10px #00f0ff;

  transition:0.5s;

}

/* FOOTER */

.footer{

  position:absolute;

  bottom:20px;

  font-size:12px;

  letter-spacing:2px;

  opacity:0.7;

}

/* MOBILE */

@media(max-width:768px){

  .topbar{

    min-height:70px;

    font-size:24px;

    padding:0 10px;

  }

  .main{

    padding:10px;

  }

  .card{

    border-radius:25px;

  }

  .input-box{

    max-width:100%;

  }

  input{

    height:60px;

    font-size:18px;

  }

  .buzzer{

    width:220px;
    height:220px;

    font-size:34px;

  }

  #status{

    font-size:26px;

    margin-top:30px;

  }

  .klasemen{

    width:170px;

    top:10px;
    right:10px;

    padding:12px;

    border-radius:22px;

  }

  .player-name{

    font-size:10px;

  }

  .bar{

    height:8px;

  }

}

/* LANDSCAPE HP */

@media(max-height:500px){

  .topbar{
    min-height:55px;
    font-size:20px;
  }

  .buzzer{

    width:170px;
    height:170px;

    font-size:28px;

  }

  #status{

    font-size:20px;

    margin-top:20px;

  }

  input{

    height:50px;

  }

}

</style>
</head>

<body>

<div class="app">

<div class="topbar">
RM KEMANG GAMES
</div>

<div class="main">

<div class="card">

<!-- KLASMEN -->

<div class="klasemen">

<h2>🏆 TOP PLAYER</h2>

<div id="ranking"></div>

</div>

<!-- INPUT -->

<div class="input-box">

<input
type="text"
id="nama"
placeholder="MASUKKAN NAMA DISINI !">

</div>

<!-- BUZZER -->

<div class="buzzer-wrap">

<button
id="btn"
class="buzzer">

TAP!

</button>

</div>

<!-- STATUS -->

<h2 id="status">
🔥 SIAPKAN JARI!
</h2>

<div class="footer">
GAME ALDI
</div>

</div>

</div>

</div>

<script>

// ================= FIREBASE
const firebaseConfig = {

  apiKey:"AIzaSyXXXX",

  authDomain:
  "game-aldi.firebaseapp.com",

  databaseURL:
  "https://game-aldi-default-rtdb.asia-southeast1.firebasedatabase.app"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const btn =
document.getElementById("btn");

const status =
document.getElementById("status");

let namaPlayer = "";

// ================= FULLSCREEN AUTO
function enterFullscreen(){

  const el = document.documentElement;

  if(el.requestFullscreen){

    el.requestFullscreen();

  }else if(el.webkitRequestFullscreen){

    el.webkitRequestFullscreen();

  }else if(el.msRequestFullscreen){

    el.msRequestFullscreen();

  }

}

document.body.addEventListener(
"click",
enterFullscreen,
{once:true}
);

// ================= BUZZER
btn.onclick = async function(){

  const nama =
  document.getElementById("nama")
  .value.trim();

  if(!nama){

    alert("Isi nama!");
    return;

  }

  namaPlayer = nama;

  btn.disabled = true;

  try{

    await db.ref("game").transaction((current)=>{

      if(
        current === null ||
        current.clicked !== true
      ){

        return {

          clicked:true,

          player:nama,

          timestamp:Date.now()

        };

      }

      return;

    });

  }catch(err){

    console.log(err);

    btn.disabled = false;

  }

};

// ================= REALTIME GAME
db.ref("game").on("value", snap => {

  const data = snap.val();

  if(!data){

    resetGameUI();
    return;

  }

  if(data.clicked === true){

    btn.disabled = true;

    btn.style.pointerEvents =
    "none";

    const winner =
    data.player;

    // MENANG
    if(winner === namaPlayer){

      status.innerHTML =
      "✅ KAMU BOLEH JAWAB!";

      btn.style.background =
      "linear-gradient(145deg,#00ff99,#00c3ff)";

      if(navigator.vibrate){

        navigator.vibrate([200,100,200]);

      }

    }

    // KALAH
    else{

      status.innerHTML =
      "❌ KALAH CEPAT DARI <br>"+winner;

      btn.style.background =
      "linear-gradient(145deg,#ff004c,#ff7a00)";

    }

  }else{

    resetGameUI();

  }

});

// ================= RESET UI
function resetGameUI(){

  btn.disabled = false;

  btn.style.pointerEvents =
  "auto";

  btn.style.background =
  "linear-gradient(145deg,#00f0ff,#0066ff)";

  status.innerHTML =
  "🔥 SIAPKAN JARI!";

}

// ================= KLASMEN
db.ref("ranking").on("value", snap => {

  const data = snap.val() || {};

  let arr = [];

  for(let nama in data){

    arr.push({

      nama:data[nama].name || nama,
      score:data[nama].score || 0

    });

  }

  arr.sort((a,b)=>b.score-a.score);

  let max =
  arr[0] ? arr[0].score : 1;

  let html = "";

  arr.forEach((item,index)=>{

    let persen =
    (item.score/max)*100;

    html += `

    <div class="player">

      <div class="player-name">

        <span>
        ${index+1}. ${item.nama}
        </span>

        <span>
        ${item.score}
        </span>

      </div>

      <div class="bar">

        <div
        class="fill"
        style="width:${persen}%">
        </div>

      </div>

    </div>

    `;

  });

  document
  .getElementById("ranking")
  .innerHTML = html;

});

// ================= CACHE FIX
window.onpageshow = function(event){

  if(event.persisted){

    window.location.reload();

  }

};

</script>

</body>
</html>
