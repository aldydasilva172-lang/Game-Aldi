<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}


body{

  font-family:'Poppins',sans-serif;

  min-height:100vh;

  overflow:hidden;

  color:white;

  background:

  linear-gradient(
    rgba(5,5,15,0.72),
    rgba(5,5,15,0.92)
  ),

  url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1600&auto=format&fit=crop');

  background-size:cover;

  background-position:center;

  background-attachment:fixed;

}


/* ================= GLOW ================= */

body::before{

  content:'';

  position:fixed;

  width:450px;

  height:450px;

  background:
  rgba(0,255,255,0.16);

  border-radius:50%;

  filter:blur(120px);

  top:-120px;

  left:-120px;

  pointer-events:none;

}


body::after{

  content:'';

  position:fixed;

  width:450px;

  height:450px;

  background:
  rgba(255,0,255,0.14);

  border-radius:50%;

  filter:blur(120px);

  bottom:-120px;

  right:-120px;

  pointer-events:none;

}


/* ================= HEADER ================= */

.topbar{

  width:100%;

  padding:30px 20px 20px;

  text-align:center;

  font-family:'Orbitron',sans-serif;

  font-size:30px;

  font-weight:900;

  letter-spacing:3px;

  background:
  rgba(255,255,255,0.05);

  backdrop-filter:blur(15px);

  border-bottom:
  1px solid rgba(255,255,255,0.08);

  text-shadow:
  0 0 20px cyan;

  box-shadow:
  0 0 25px rgba(0,255,255,0.15);

}


/* ================= CONTAINER ================= */

.container{

  width:100%;

  height:calc(100vh - 80px);

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  padding:20px;

}


/* ================= CARD ================= */

.card{

  width:100%;

  max-width:420px;

  position:relative;

  overflow:hidden;

  background:
  rgba(15,15,35,0.28);

  backdrop-filter:blur(18px);

  -webkit-backdrop-filter:blur(18px);

  border:
  1px solid rgba(255,255,255,0.08);

  border-radius:35px;

  padding:30px 20px;

  text-align:center;

  box-shadow:
  0 0 40px rgba(0,0,0,0.45);

  transform:translateY(-35px);

}


/* ================= NAMA PEMAIN ================= */

.player-display{

  display:inline-block;

  margin-bottom:18px;

  padding:10px 20px;

  border-radius:15px;

  background:
  rgba(0,240,255,0.07);

  border:
  1px solid rgba(0,240,255,0.20);

  backdrop-filter:blur(10px);

  -webkit-backdrop-filter:blur(10px);

  font-family:'Orbitron',sans-serif;

  font-size:15px;

  font-weight:700;

  letter-spacing:1px;

  color:#00f0ff;

  text-shadow:
  0 0 12px rgba(0,240,255,0.8);

  box-shadow:
  0 0 18px rgba(0,240,255,0.08);

}


/* ================= INPUT ================= */

input{

  width:100%;

  height:58px;

  border:none;

  outline:none;

  border-radius:18px;

  background:
  rgba(255,255,255,0.08);

  color:white;

  font-size:18px;

  text-align:center;

  border:
  1px solid rgba(255,255,255,0.08);

  transition:0.3s;

}


input:focus{

  border:
  1px solid cyan;

  box-shadow:
  0 0 20px cyan;

}


input::placeholder{

  color:#ccc;

}


/* ================= BUZZER ================= */

.buzzer-wrap{

  display:flex;

  justify-content:center;

  margin-top:35px;

}


.buzzer{

  width:230px;

  height:230px;

  border:none;

  border-radius:50%;

  cursor:pointer;

  position:relative;

  overflow:hidden;

  font-family:'Orbitron',sans-serif;

  font-size:34px;

  font-weight:900;

  color:white;

  background:
  linear-gradient(
    145deg,
    #00f0ff,
    #0066ff
  );

  box-shadow:

  0 0 30px #00f0ff,

  0 0 70px rgba(0,240,255,0.45),

  inset 0 -12px 20px rgba(0,0,0,0.35);

  transition:0.2s;

}


.buzzer:hover{

  transform:scale(1.03);

}


.buzzer:active{

  transform:scale(0.95);

}


/* ================= SPAM ================= */

.buzzer.spam{

  background:
  linear-gradient(
    145deg,
    #ff0000,
    #8b0000
  ) !important;

  box-shadow:

  0 0 30px #ff0000,

  0 0 80px rgba(255,0,0,0.65),

  inset 0 -12px 20px rgba(0,0,0,0.4) !important;

  cursor:not-allowed;

}


#spamText{

  margin-top:15px;

  color:#ff3333;

  font-family:'Orbitron',sans-serif;

  font-size:18px;

  font-weight:900;

  text-shadow:
  0 0 15px red;

}


/* ================= SHINE ================= */

.buzzer::before{

  content:'';

  position:absolute;

  width:100%;

  height:100%;

  background:

  linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.35),
    transparent
  );

  top:0;

  left:-100%;

  animation:shine 3s infinite;

}


@keyframes shine{

  100%{
    left:100%;
  }

}


/* ================= STATUS ================= */

#status{

  margin-top:28px;

  font-size:28px;

  font-weight:700;

  line-height:1.5;

  text-shadow:
  0 0 15px rgba(255,255,255,0.3);

}


/* ================= KLASMEN ================= */

.klasemen{

  position:fixed;

  bottom:15px;

  right:15px;

  width:min(180px,45vw);

  max-width:200px;

  min-width:140px;

  padding:12px;

  border-radius:22px;

  background:
  rgba(15,15,35,0.78);

  backdrop-filter:blur(18px);

  border:
  1px solid rgba(255,255,255,0.08);

  box-shadow:
  0 0 25px rgba(0,0,0,0.35);

  z-index:9999;

  cursor:grab;

  touch-action:none;

  user-select:none;

  transition:
  box-shadow 0.2s,
  transform 0.15s;

}


.klasemen:active{

  cursor:grabbing;

  transform:scale(0.98);

}


.klasemen h2{

  font-size:13px;

  margin-bottom:12px;

  text-align:center;

  letter-spacing:1px;

}


/* ================= RANKING HEADER ================= */

.ranking-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:8px;

  margin-bottom:12px;

}


.ranking-header h2{

  margin-bottom:0;

  flex:1;

}


#toggleRanking{

  border:none;

  outline:none;

  padding:5px 9px;

  border-radius:8px;

  background:
  rgba(255,255,255,0.08);

  1px solid rgba(0,240,255,0.35);

  color:#00f0ff;

  font-family:'Orbitron',sans-serif;

  font-size:8px;

  font-weight:700;

  cursor:pointer;

  transition:.2s;

}


#toggleRanking:hover{

  background:
  rgba(0,240,255,0.15);

  box-shadow:
  0 0 10px rgba(0,240,255,.35);

}


#toggleRanking:active{

  transform:scale(.94);

}


.player{

  margin-bottom:10px;

}


.player-name{

  display:flex;

  justify-content:space-between;

  font-size:10px;

  margin-bottom:4px;

  font-weight:600;

}


.bar{

  width:100%;

  height:10px;

  background:
  rgba(255,255,255,0.08);

  border-radius:30px;

  overflow:hidden;

}


.fill{

  height:100%;

  border-radius:25px;

  background:

  linear-gradient(
    90deg,
    #00f0ff,
    #8a2eff,
    #ff00d4
  );

  box-shadow:
  0 0 10px #00f0ff;

  transition:0.5s;

}


/* ================= FOOTER ================= */

.footer{

  margin-top:22px;

  font-size:10px;

  opacity:0.7;

  letter-spacing:1px;

}


/* ================= LOGIN ================= */

.login-screen{

  position:fixed;

  inset:0;

  display:flex;

  justify-content:center;

  align-items:center;

  background:
  rgba(5,5,15,.92);

  backdrop-filter:blur(12px);

  z-index:99999;

}


.login-box{

  width:90%;

  max-width:360px;

  padding:30px;

  border-radius:25px;

  background:
  rgba(20,20,40,.75);

  border:
  1px solid rgba(255,255,255,.08);

  text-align:center;

}


.login-box h1{

  font-family:'Orbitron',sans-serif;

  margin-bottom:10px;

  color:#00f0ff;

}


.login-box p{

  margin-bottom:20px;

  opacity:.8;

}


.login-box button{

  width:100%;

  height:55px;

  margin-top:15px;

  border:none;

  border-radius:15px;

  font-size:18px;

  font-weight:bold;

  background:
  linear-gradient(
    145deg,
    #00f0ff,
    #0066ff
  );

  color:white;

  cursor:pointer;

}


.login-box button:disabled{

  opacity:.5;

}


/* ================= LOGIN STATUS ================= */

#loginStatus{

  margin-top:18px;

  font-size:14px;

  line-height:1.6;

  min-height:25px;

  color:#00f0ff;

  font-weight:600;

}


/* ================= HIDDEN ================= */

.hidden{

  display:none !important;

}


/* ================= MOBILE ================= */

@media(max-width:600px){

  .topbar{

    font-size:26px;

  }


  .buzzer{

    width:210px;

    height:210px;

    font-size:30px;

  }


  #status{

    font-size:18px;

  }


  .player-display{

    font-size:13px;

    padding:9px 16px;

  }


  .klasemen{

    width:160px;

    bottom:10px;

    right:10px;

    padding:10px;

  }


  .bar{

    height:8px;

  }

}

</style>

<div
id="loginScreen"

>

        id="btn"

        TAP!

      </button>

    </div>

    <h2 id="status">

      🔥 SIAPKAN JARI!

    </h2>


    <div class="footer">

      OUTING RANCH MARKET KEMANG 2026

    </div>

  </div>

</div>


<script>


// =================================================
// FIREBASE
// =================================================

const firebaseConfig = {

  apiKey:
  "AIzaSyD36RSQ5epBRSbeI9JnEkI2UevOg921xrI",

  authDomain:
  "game-aldi.firebaseapp.com",

  databaseURL:
  "https://game-aldi-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
  "game-aldi",

  storageBucket:
  "game-aldi.firebasestorage.app",

  messagingSenderId:
  "184345142676",

  appId:
  "1:184345142676:web:f19d19999c897d0ca95b81"

};


firebase.initializeApp(firebaseConfig);


const db =
firebase.database();


// =================================================
// ELEMENT
// =================================================

const btn =
document.getElementById("btn");

const status =
document.getElementById("status");

const loginScreen =
document.getElementById("loginScreen");

const loginNama =
document.getElementById("loginNama");

const mulaiBtn =
document.getElementById("mulaiBtn");

const loginStatus =
document.getElementById("loginStatus");

const spamText =
document.getElementById("spamText");

const playerDisplay =
document.getElementById("playerDisplay");


// =================================================
// PLAYER ID
// =================================================

function buatPlayerID(){

  return (
    "player_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2,8)
  );

}


let playerID =
localStorage.getItem(
  "rmKemangPlayerID"
);


if(!playerID){

  playerID =
    buatPlayerID();


  localStorage.setItem(
    "rmKemangPlayerID",
    playerID
  );

}


let namaPlayer = "";

let playerStatus = "";

let playerSpam = false;

let buzzerLocked = false;

let lastClickTime = 0;


// =================================================
// ANTI SPAM
// =================================================

const SPAM_DELAY = 2000;

const CLICK_DELAY = 700;


// =================================================
// PLAYER LISTENER
// =================================================

let playerRef = null;
let playerListener = null;


function pasangPlayerListener(){

  if(playerRef && playerListener){

    playerRef.off(
      "value",
      playerListener
    );

  }


  playerRef =
    db.ref(
      "players/" +
      playerID
    );


  playerListener =
    snap => {

      const data =
        snap.val();


      // =========================================
      // DATA PLAYER TIDAK ADA
      // =========================================

      if(!data){

        namaPlayer = "";

        playerStatus = "";

        playerSpam = false;

        buzzerLocked = true;

        lastClickTime = 0;


        window.currentGameData = null;


        playerDisplay.innerHTML =
          "👤 BELUM LOGIN";


        loginScreen
          .classList
          .remove("hidden");


        loginNama.value = "";

        loginNama.disabled = false;

        mulaiBtn.disabled = false;


        loginStatus.innerHTML =
          "👤 MASUKKAN NAMA UNTUK BERMAIN";


        btn.disabled = true;

        btn.style.pointerEvents =
          "none";


        resetBuzzerColor();


        status.innerHTML =
          "👤 MASUKKAN NAMA";


        return;

      }


      // =========================================
      // DATA PLAYER ADA
      // =========================================

      namaPlayer =
        data.name ||
        namaPlayer;


      playerDisplay.innerHTML =
        "👤 " +
        escapeHTML(namaPlayer);


      playerStatus =
        data.status ||
        "";


      playerSpam =
        data.spam === true;


      // =========================================
      // SPAM
      // =========================================

      if(playerSpam){

        buzzerLocked = true;


        btn.disabled = false;

        btn.style.pointerEvents =
          "auto";


        btn.classList
          .add("spam");


        spamText.innerHTML =
          "⚠ SPAM!";


        status.innerHTML =
          "⛔ MENUNGGU RESET / BUKA SPAM";


        return;

      }


      // =========================================
      // PENDING
      // =========================================

      if(
        data.status === "pending"
      ){

        loginScreen
          .classList
          .remove("hidden");


        loginNama.value =
          namaPlayer;


        loginNama.disabled =
          true;


        mulaiBtn.disabled =
          true;


        loginStatus.innerHTML =
          "⏳ MENUNGGU PERSETUJUAN ADMIN";


        btn.disabled =
          true;


        btn.style.pointerEvents =
          "none";


        resetBuzzerColor();


        status.innerHTML =
          "⏳ MENUNGGU PERSETUJUAN";


        buzzerLocked =
          true;


        return;

      }


      // =========================================
      // APPROVED
      // =========================================

      if(
        data.status === "approved"
      ){

        loginScreen
          .classList
          .add("hidden");


        btn.disabled =
          false;


        btn.style.pointerEvents =
          "auto";


        btn.classList
          .remove("spam");


        spamText.innerHTML =
          "";


        if(
          !window.currentGameData ||
          window.currentGameData.clicked !== true
        ){

          resetBuzzerColor();

          buzzerLocked =
            false;

          lastClickTime =
            0;


          status.innerHTML =
            "🔥 SIAPKAN JARI!";

        }
        else{

          buzzerLocked =
            false;

        }

      }

    };


  playerRef.on(
    "value",
    playerListener
  );

}


pasangPlayerListener();


// =================================================
// NORMALISASI NAMA
// =================================================

function normalisasiNama(nama){

  return nama

    /*
      Normalisasi Unicode.
      Contoh karakter yang secara visual
      terlihat sama akan dibuat lebih konsisten.
    */
    .normalize("NFKC")

    /*
      Hapus karakter zero-width / invisible.
    */
    .replace(
      /[\u200B-\u200D\uFEFF]/g,
      ""
    )

    /*
      Samakan semua jenis whitespace
      menjadi satu spasi.
    */
    .replace(
      /\s+/g,
      " "
    )

    .trim()

    .toLowerCase();

}


// =================================================
// BUAT KEY NAMA
// =================================================

function namaKey(nama){

  return encodeURIComponent(
    normalisasiNama(nama)
  );

}


// =================================================
// PLAYER LOGIN
// =================================================

mulaiBtn.onclick =
async function(){

  const nama =
    loginNama.value.trim();


  if(!nama){

    loginStatus.innerHTML =
      "⚠️ Masukkan nama terlebih dahulu!";

    return;

  }


  const namaNormal =
    normalisasiNama(nama);


  /*
    Pastikan setelah normalisasi
    nama masih memiliki isi.
  */

  if(!namaNormal){

    loginStatus.innerHTML =
      "⚠️ Nama tidak valid!";

    return;

  }


  const key =
    namaKey(namaNormal);


  mulaiBtn.disabled =
    true;

  loginNama.disabled =
    true;


  loginStatus.innerHTML =
    "⏳ Mengamankan nama...";


  try{

    /*
      =================================================
      CLAIM NAMA DENGAN TRANSACTION
      =================================================

      Firebase akan memproses transaction
      secara atomic.

      HP A dan HP B yang mencoba nama sama
      pada waktu hampir bersamaan tidak akan
      sama-sama mendapatkan nama tersebut.
    */

    const nameRef =
      db.ref(
        "playerNames/" +
        key
      );


    const result =
      await nameRef.transaction(
        current => {

          /*
            BELUM ADA PEMILIK

            Player ini mengambil nama.
          */

          if(current === null){

            return playerID;

          }


          /*
            SUDAH ADA PEMILIK

            Jangan ubah data yang sudah ada.
          */

          return current;

        }
      );


    /*
      =================================================
      PASTIKAN TRANSACTION BENAR-BENAR COMMITTED
      =================================================
    */

    if(!result.committed){

      mulaiBtn.disabled =
        false;

      loginNama.disabled =
        false;


      loginStatus.innerHTML =
        "❌ Nama gagal diamankan.<br>" +
        "Silakan coba lagi.";

      return;

    }


    /*
      =================================================
      CEK PEMILIK NAMA
      =================================================
    */

    const pemilikNama =
      result.snapshot.val();


    /*
      Jika pemilik bukan player ini,
      nama sudah digunakan player lain.
    */

    if(
      pemilikNama !== playerID
    ){

      mulaiBtn.disabled =
        false;

      loginNama.disabled =
        false;


      loginStatus.innerHTML =
        "❌ NAMA SUDAH DIGUNAKAN!<br>" +
        "Silakan gunakan nama lain.";

      return;

    }


    /*
      =================================================
      NAMA BERHASIL DIKLAIM
      =================================================
    */

    namaPlayer =
      nama;


    playerDisplay.innerHTML =
      "👤 " +
      escapeHTML(namaPlayer);


    loginStatus.innerHTML =
      "⏳ Mengirim permintaan ke admin...";


    /*
      Simpan data player.
    */

    await db.ref(
      "players/" +
      playerID
    )
    .set({

      name:
        namaPlayer,

      status:
        "pending",

      spam:
        false,

      timestamp:
        Date.now()

    });


  }

  catch(error){

    console.log(error);


    mulaiBtn.disabled =
      false;

    loginNama.disabled =
      false;


    /*
      Jika gagal karena permission,
      network, atau Firebase error,
      jangan dianggap nama berhasil.
    */

    loginStatus.innerHTML =
      "❌ Gagal mengamankan nama.<br>" +
      "Silakan coba lagi.";

  }

};


// =================================================
// ENTER
// =================================================

loginNama.addEventListener(
  "keypress",
  function(e){

    if(e.key === "Enter"){

      mulaiBtn.click();

    }

  }
);


// =================================================
// BUZZER
// =================================================

btn.addEventListener(
  "click",
  async function(){

    const now =
      Date.now();


    // =============================================
    // SPAM SUDAH AKTIF
    // =============================================

    if(playerSpam){

      return;

    }


    // =============================================
    // BELUM APPROVED
    // =============================================

    if(
      playerStatus !== "approved"
    ){

      return;

    }


    // =============================================
    // DOUBLE TAP ≤ 2 DETIK
    // =============================================

    if(
      lastClickTime > 0 &&
      now - lastClickTime <= SPAM_DELAY
    ){

      playerSpam = true;

      buzzerLocked = true;


      btn.disabled =
        false;


      btn.style.pointerEvents =
        "auto";


      btn.classList
        .add("spam");


      spamText.innerHTML =
        "⚠ SPAM!";


      status.innerHTML =
        "⛔ SPAM!";


      try{

        await db.ref(
          "players/" +
          playerID +
          "/spam"
        )
        .set(true);


        await db.ref("game")
        .transaction(
          current => {

            if(
              current &&
              current.clicked === true &&
              current.playerID === playerID
            ){

              return null;

            }


            return;

          }
        );

      }

      catch(error){

        console.log(error);

      }


      return;

    }


    // =============================================
    // KLIK NORMAL
    // =============================================

    if(
      buzzerLocked
    ){

      return;

    }


    if(
      btn.disabled
    ){

      return;

    }


    lastClickTime =
      now;


    buzzerLocked =
      true;


    btn.disabled =
      false;

    btn.style.pointerEvents =
      "auto";


    try{

      await db.ref("game")
      .transaction(
        current => {

          if(

            current === null ||

            current.clicked !== true

          ){

            return {

              clicked:
                true,

              player:
                namaPlayer,

              playerID:
                playerID,

              timestamp:
                Date.now()

            };

          }


          return;

        }
      );

    }

    catch(error){

      console.log(error);


      buzzerLocked =
        false;

    }

  }
);


// =================================================
// GAME REALTIME
// =================================================

window.currentGameData = null;


db.ref("game")
.on(
  "value",
  snap => {

    const data =
      snap.val();


    window.currentGameData =
      data;


    // =============================================
    // GAME RESET / PEMENANG DIBATALKAN
    // =============================================

    if(!data){

      window.currentGameData = null;


      resetGameUI();

      return;

    }


    // =============================================
    // JIKA SPAM
    // =============================================

    if(playerSpam){

      btn.disabled =
        false;


      btn.style.pointerEvents =
        "auto";


      btn.classList
        .add("spam");


      spamText.innerHTML =
        "⚠ SPAM!";


      status.innerHTML =
        "⛔ MENUNGGU RESET / BUKA SPAM";


      buzzerLocked =
        true;


      return;

    }


    // =============================================
    // GAME SUDAH PUNYA PEMENANG
    // =============================================

    if(
      data.clicked === true
    ){

      btn.disabled =
        false;


      btn.style.pointerEvents =
        "auto";


      buzzerLocked =
        false;


      const winner =
        data.player;


      // =========================================
      // SAYA PEMENANG
      // =========================================

      if(
        data.playerID === playerID
      ){

        btn.classList
          .remove("spam");


        spamText.innerHTML =
          "";


        btn.style.background =
          "linear-gradient(145deg,#00ff99,#00c3ff)";


        status.innerHTML =
          "KAMU BOLEH JAWAB!✅";


        if(
          navigator.vibrate
        ){

          navigator.vibrate([
            200,
            100,
            200
          ]);

        }

      }


      // =========================================
      // PEMAIN LAIN
      // =========================================

      else{

        btn.classList
          .remove("spam");


        spamText.innerHTML =
          "";


        btn.style.background =
          "linear-gradient(145deg,#ff004c,#ff7a00)";


        status.innerHTML =
          `KAMU KALAH CEPAT DARI ❌<br>${escapeHTML(winner)}`;

      }

    }

  }
);


// =================================================
// RESET BUZZER COLOR
// =================================================

function resetBuzzerColor(){

  spamText.innerHTML = "";

  btn.style.background =
    "linear-gradient(145deg,#00f0ff,#0066ff)";

}


// =================================================
// RESET GAME UI
// =================================================

function resetGameUI(){

  resetBuzzerColor();


  if(
    playerStatus !== "approved"
  ){

    buzzerLocked =
      true;


    btn.disabled =
      true;


    btn.style.pointerEvents =
      "none";


    return;

  }


  if(playerSpam){

    btn.disabled =
      false;


    btn.style.pointerEvents =
      "auto";


    btn.classList
      .add("spam");


    spamText.innerHTML =
      "⚠ SPAM!";


    status.innerHTML =
      "⛔ MENUNGGU RESET / BUKA SPAM";


    buzzerLocked =
      true;


    return;

  }


  buzzerLocked =
    false;


  lastClickTime =
    0;


  btn.disabled =
    false;


  btn.style.pointerEvents =
    "auto";


  btn.classList
    .remove("spam");


  spamText.innerHTML =
    "";


  btn.style.background =
    "linear-gradient(145deg,#00f0ff,#0066ff)";


  status.innerHTML =
    "🔥 SIAPKAN JARI!";

}


// =================================================
// RANKING
// =================================================

db.ref("ranking")
.on(
  "value",
  snap => {

    const data =
      snap.val() || {};


    let arr = [];


    for(
      let nama in data
    ){

      arr.push({

        nama:
          data[nama].name ||
          nama,

        score:
          data[nama].score ||
          0

      });

    }


    arr.sort(
      (a,b) =>
        b.score - a.score
    );


    let max =
      arr[0]
        ? arr[0].score
        : 1;


    let html = "";


    arr.forEach(
      (item,index) => {

        let persen =
          (item.score / max) *
          100;


        html += `

        <div class="player">

          <div class="player-name">

            <span>
              ${escapeHTML(item.nama)}
            </span>

            <span>
              ${item.score}
            </span>

          </div>

          <div class="bar">

            <div
              class="fill"
              style="width:${persen}%"
            ></div>

          </div>

        </div>

        `;

      }
    );


    document
      .getElementById("ranking")
      .innerHTML =
        html;

  }
);

// =================================================
// ESCAPE HTML
// =================================================

function escapeHTML(text){

  const div =
    document.createElement("div");


  div.textContent =
    text || "";


  return div.innerHTML;

}

// =================================================
// DRAG KLASMEN
// =================================================

const klasemen =
document.querySelector(
  ".klasemen"
);


let isDragging =
  false;

let offsetX =
  0;

let offsetY =
  0;


let startX = 15;

let startY = 90;


klasemen.style.left =
  startX + "px";


klasemen.style.top =
  startY + "px";


klasemen.style.right =
  "auto";


klasemen.style.bottom =
  "auto";


function dragStart(x,y){

  isDragging =
    true;


  const rect =
    klasemen.getBoundingClientRect();


  offsetX =
    x - rect.left;


  offsetY =
    y - rect.top;

}


function dragMove(x,y){

  if(!isDragging)
    return;


  let newX =
    x - offsetX;


  let newY =
    y - offsetY;


  const maxX =
    window.innerWidth -
    klasemen.offsetWidth;


  const maxY =
    window.innerHeight -
    klasemen.offsetHeight;


  newX =
    Math.max(
      0,
      Math.min(
        newX,
        maxX
      )
    );


  newY =
    Math.max(
      0,
      Math.min(
        newY,
        maxY
      )
    );


  klasemen.style.left =
    newX + "px";


  klasemen.style.top =
    newY + "px";

}


function dragEnd(){

  isDragging =
    false;

}


// =================================================
// TOUCH
// =================================================

klasemen.addEventListener(
  "touchstart",
  e => {

    const t =
      e.touches[0];


    dragStart(
      t.clientX,
      t.clientY
    );

  }
);


document.addEventListener(
  "touchmove",
  e => {

    if(!isDragging)
      return;


    const t =
      e.touches[0];


    dragMove(
      t.clientX,
      t.clientY
    );


    e.preventDefault();

  },
  {
    passive:false
  }
);


document.addEventListener(
  "touchend",
  dragEnd
);


// =================================================
// MOUSE
// =================================================

klasemen.addEventListener(
  "mousedown",
  e => {

    dragStart(
      e.clientX,
      e.clientY
    );

  }
);


document.addEventListener(
  "mousemove",
  e => {

    dragMove(
      e.clientX,
      e.clientY
    );

  }
);


document.addEventListener(
  "mouseup",
  dragEnd
);


</script>
